<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>ตารางจองห้องประชุม</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" />
  <style>
    /* Ramasri hues, deepened for TV panels (brand pastels: leaf #8cbaa3, teal #669283, sage #c8e0d3,
       mint #e5efe2, forest #3a5356, healing #e2be76, care #c98f7f).
       header band #bfdcc9 on a white sheet, ink #13302f, ink-2 #284441, hero green #147a4c (free + busy), text on green #fff, gold #ffd166
       Motif: Ramasri ribbon pinwheel (assets/ramasri-pinwheel.png, mint #e5efe2 on transparent), cropped off-edge.
       Motion: transform/opacity only; ?motion=0 or prefers-reduced-motion adds body.no-motion (all static). */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff; /* letterbox = the white sheet (most of the stage edge) */
    }
    body {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .plex, .time, .date, .room, .free-word, .next-until, .next-label, .next-time,
    .busy-label, .busy-title, .busy-when, .idle-title, .group-head, .item-time, .more, .empty, .foot-cta, .tag {
      font-family: 'IBM Plex Sans Thai', Tahoma, sans-serif;
    }
    .is-hidden { display: none !important; }

    /* Design stage, scaled + centred by fitStage(): 1080x1920 portrait, 1920x1080 with body.is-land */
    #stage {
      position: absolute;
      z-index: 0; /* own stacking context: .sheet-art (z -1) sits above the white, below the content */
      left: 50%;
      top: 50%;
      width: 1080px;
      height: 1920px;
      margin: -960px 0 0 -540px;
      overflow: hidden;
      background: #fff;
      color: #13302f;
      font-family: 'Sarabun', Tahoma, sans-serif;
      -webkit-transform-origin: 50% 50%;
      -ms-transform-origin: 50% 50%;
      transform-origin: 50% 50%;
    }
    /* faint mint pinwheel, half size, sitting just above the footer band in the sheet's bottom-right corner;
       mint #e5efe2 keeps ink-2 text 8.9:1 */
    .sheet-art {
      position: absolute;
      z-index: -1;
      right: 0;
      bottom: 180px;
      width: 280px;
      height: 280px;
      background: url(assets/ramasri-pinwheel.png) no-repeat 0 0;
      background-size: 380px 380px;
    }

    /* 1. header: sage band (mint is lighter than sage, so ink contrast only rises) */
    .top, .room {
      background: #bfdcc9;
    }
    .top {
      position: relative;
      height: 164px;
    }
    .logo {
      position: absolute;
      left: 72px;
      top: 56px;
      width: 403px;
      height: 84px;
    }
    .clock {
      position: absolute;
      right: 72px;
      top: 40px;
      text-align: right;
    }
    .time {
      font-size: 72px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -1px;
    }
    .colon { /* opacity only: the digits never shift */
      -webkit-animation: blink 1s linear infinite;
      animation: blink 1s linear infinite;
    }
    .date {
      margin-top: 10px;
      font-size: 28px;
      font-weight: 500;
      line-height: 1.3;
      color: #284441;
    }

    /* 2. room */
    .room {
      height: 124px;
      margin: -2px 0 0; /* overlaps .top by 2px: patches the scale-transform hairline so the sage band reads as one piece */
      padding: 6px 72px 0;
      box-sizing: border-box;
      font-size: 84px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 3. status hero: same fixed height in every state so the timeline never jumps */
    .hero {
      position: relative;
      height: 620px;
      overflow: hidden;
      color: #fff;
      background: #a3c9b3;
      border-bottom-right-radius: 200px;
    }
    .hero.is-free, .hero.is-busy { background: #147a4c; } /* one primary green; states differ only by content */
    .hero.is-idle { color: #13302f; }
    /* aurora: oversized equal-luminance hue gradient (deep green / brand / emerald / teal-green), moved by transform only.
       Lightest stop #147a4c keeps white text >=4.6:1 even under the pinwheel. */
    .hero-aurora {
      position: absolute;
      left: 0;
      top: 0;
      width: 150%;
      height: 150%;
      opacity: 0;
      background: #147a4c;
      background: -webkit-linear-gradient(-30deg, #15783a 0%, #147a4c 25%, #0d7751 50%, #0c7661 75%, #147a4c 100%);
      background: linear-gradient(120deg, #15783a 0%, #147a4c 25%, #0d7751 50%, #0c7661 75%, #147a4c 100%);
      -webkit-transition: opacity 1s ease;
      transition: opacity 1s ease;
      -webkit-animation: aurora 20s ease-in-out infinite;
      animation: aurora 20s ease-in-out infinite;
      will-change: transform;
    }
    .is-free .hero-aurora, .is-busy .hero-aurora { opacity: 1; }
    .is-idle .hero-aurora { -webkit-animation-play-state: paused; animation-play-state: paused; }
    .hero-art { /* big pinwheel, centred near the top-right and cut by the hero edges; one turn per 120s */
      position: absolute;
      right: -380px;
      top: -330px;
      width: 1000px;
      height: 1000px;
      background: url(assets/ramasri-pinwheel.png) no-repeat;
      background-size: 100% 100%;
      opacity: .09; /* mint at 9%: white text >=4.6:1 on the lightest aurora stop */
      -webkit-animation: spin 120s linear infinite;
      animation: spin 120s linear infinite;
      will-change: transform;
    }
    .hero-body {
      position: relative;
      height: 100%;
    }
    .is-free .hero-body, .is-busy .hero-body { /* static light corner (no text reaches it) */
      background: -webkit-linear-gradient(top right, #22955f 0%, rgba(34, 149, 95, 0) 10%);
      background: linear-gradient(to bottom left, #22955f 0%, rgba(34, 149, 95, 0) 10%);
    }
    .hero-view { /* one per state; a new view crossfades over the old one */
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      padding: 44px 72px 48px;
      box-sizing: border-box;
    }
    .is-in { -webkit-animation: fade-in .9s ease-out backwards; animation: fade-in .9s ease-out backwards; }
    .is-out { -webkit-animation: fade-out .9s ease-in forwards; animation: fade-out .9s ease-in forwards; }

    /* FREE */
    .free-word {
      margin: -4px 0 0 -4px;
      font-size: 168px;
      font-weight: 600;
      line-height: 1.1;
    }
    .next {
      margin-top: 6px;
      padding: 24px 36px 26px;
      background: #fff;
      color: #13302f;
      border-radius: 32px;
    }
    .next-until {
      font-size: 46px;
      font-weight: 600;
      line-height: 1.25;
    }
    .next-sub {
      margin-top: 4px;
      font-size: 30px;
      line-height: 1.45;
      color: #284441;
    }
    .next-row {
      display: -webkit-flex;
      display: flex;
      margin-top: 16px;
      padding-top: 18px;
      border-top: 3px solid #e5efe2;
    }
    .next-when {
      width: 232px;
      -webkit-flex: none;
      flex: none;
    }
    .next-label {
      font-size: 26px;
      font-weight: 500;
      line-height: 1.3;
      color: #284441;
    }
    .next-time {
      font-size: 32px;
      font-weight: 600;
      line-height: 1.35;
    }
    .next-title {
      -webkit-flex: 1;
      flex: 1;
      min-width: 0;
      max-height: 92px;
      overflow: hidden;
      font-size: 32px;
      font-weight: 500;
      line-height: 1.44;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .quote {
      position: absolute;
      left: 72px;
      right: 96px;
      bottom: 44px;
      margin: 0;
      font-size: 32px;
      font-weight: 500;
      line-height: 1.5;
      text-indent: -0.42em;
    }

    /* BUSY */
    .busy-label {
      font-size: 34px;
      font-weight: 500;
      line-height: 1.3;
      color: #fff;
    }
    .dot {
      position: relative;
      display: inline-block;
      width: 20px;
      height: 20px;
      margin: 0 16px 4px 0;
      vertical-align: middle;
      border-radius: 50%;
      background: #ffd166;
    }
    .dot:after, .ring { /* breathing ring */
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ffd166;
      opacity: 0;
      -webkit-animation: ring 2.4s ease-out infinite;
      animation: ring 2.4s ease-out infinite;
    }
    .busy-title {
      margin: 12px 0 0;
      overflow: hidden;
      font-size: 68px;
      font-weight: 600;
      line-height: 1.3;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .busy-foot {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 48px;
    }
    .busy-when {
      font-size: 44px;
      font-weight: 600;
      line-height: 1.25;
    }
    .bar {
      height: 16px;
      margin: 16px 0 20px;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(0, 0, 0, .22);
    }
    .bar i {
      position: relative;
      display: block;
      height: 100%;
      overflow: hidden;
      border-radius: 8px;
      background: #ffd166;
    }
    .bar i:after { /* light sweep every 4s */
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: -webkit-linear-gradient(left, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, .65) 50%, rgba(255, 255, 255, 0) 70%);
      background: linear-gradient(to right, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, .65) 50%, rgba(255, 255, 255, 0) 70%);
      -webkit-transform: translate3d(-100%, 0, 0);
      transform: translate3d(-100%, 0, 0);
      -webkit-animation: shimmer 4s ease-in-out infinite;
      animation: shimmer 4s ease-in-out infinite;
    }
    .busy-meta {
      font-size: 30px;
      line-height: 1.4;
      color: #fff;
    }
    .busy-meta b, .item-meta b { font-weight: 600; }
    .busy-meta b { color: #fff; }
    .busy-meta span, .item-meta span { margin-right: 44px; }

    /* loading / error */
    .idle { padding-top: 24px; }
    .idle-title {
      font-size: 64px;
      font-weight: 600;
      line-height: 1.3;
    }
    .idle-sub {
      max-width: 900px;
      margin-top: 20px;
      font-size: 34px;
      line-height: 1.5;
    }

    /* 4. upcoming timeline: fixed box, rows are dropped to fit (never the box) */
    .panel {
      height: 832px;
      margin: 0 40px;
      padding: 36px 32px 20px;
      box-sizing: border-box;
    }
    .agenda {
      height: 100%;
      overflow: hidden;
    }
    .rise { /* staggered fade-up; rows are only rebuilt when the data changes */
      -webkit-animation: rise .7s ease-out backwards;
      animation: rise .7s ease-out backwards;
    }
    .group + .group { margin-top: 14px; }
    .group-head {
      margin-bottom: 10px;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.3;
    }
    .item {
      display: -webkit-flex;
      display: flex;
    }
    .item.is-now { /* mint tint band: ink-2 text 8.9:1 */
      margin: 0 -16px;
      padding: 10px 16px 0;
      border-radius: 18px;
      background: #e5efe2;
    }
    .item-time {
      width: 132px;
      -webkit-flex: none;
      flex: none;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.3;
    }
    .item-time small {
      display: block;
      font-size: 26px;
      font-weight: 400;
      line-height: 1.3;
      color: #284441;
    }
    .item-rail {
      position: relative;
      width: 60px;
      -webkit-flex: none;
      flex: none;
    }
    .item-rail:before {
      content: "";
      position: absolute;
      left: 28px;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #a3c9b3;
    }
    .is-now .item-rail:before { top: -10px; } /* bridge the band's top padding */
    /* first row of each group: rail starts at the dot's centre, nothing above it.
       ":first-child" never matched here (.group-head is always the true first child), so use the sibling that follows it. */
    .group-head + .item .item-rail:before { top: 26px; }
    .item:last-child .item-rail:before { bottom: auto; height: 22px; }
    .item.is-now:last-child .item-rail:before { height: 32px; }
    /* solo booking in a group (first AND last row): no rail at all, same "true first child" reasoning as above */
    .group-head + .item:last-child .item-rail:before { display: none; }
    .item-rail:after {
      content: "";
      position: absolute;
      left: 16px;
      top: 12px;
      width: 18px;
      height: 18px;
      border: 5px solid #fff;
      border-radius: 50%;
      background: #147a4c;
    }
    .is-now .item-rail:after { background: #e0a93b; }
    .item-rail .ring {
      left: 16px;
      top: 12px;
      width: 28px;
      height: 28px;
      background: #e0a93b;
    }
    .item-body {
      -webkit-flex: 1;
      flex: 1;
      min-width: 0;
      padding-bottom: 14px;
    }
    .item-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 34px;
      font-weight: 500;
      line-height: 1.4;
    }
    .tag {
      display: inline-block;
      margin-right: 14px;
      padding: 0 16px;
      vertical-align: 4px;
      border-radius: 20px;
      background: #147a4c;
      color: #fff;
      font-size: 22px;
      font-weight: 500;
      line-height: 38px;
    }
    .item-meta {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 26px;
      line-height: 1.4;
      color: #284441;
    }
    .item-meta b { color: #13302f; }
    .more {
      margin: 0 0 0 192px;
      font-size: 28px;
      font-weight: 500;
      line-height: 1.4;
      color: #284441;
    }
    .empty {
      padding-top: 150px;
      text-align: center;
      font-size: 40px;
      font-weight: 500;
      color: #284441;
    }

    /* 5. footer: full-width mint-grey band (ink-2 text 9.3:1), white tile behind the QR */
    .foot {
      position: relative;
      height: 180px;
      padding: 0 72px;
      background: #ebf3ee;
      box-sizing: border-box;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
    }
    .qr {
      width: 128px;
      height: 128px;
      padding: 12px;
      -webkit-flex: none;
      flex: none;
      border: 2px solid #d3e5da;
      border-radius: 20px;
      background: #fff;
    }
    .qr img {
      display: block;
      width: 128px;
      height: 128px;
    }
    .foot-text { margin-left: 36px; }
    .foot-cta {
      font-size: 38px;
      font-weight: 600;
      line-height: 1.3;
    }
    .foot-tag {
      margin-top: 4px;
      font-size: 28px;
      line-height: 1.45;
      color: #284441;
    }
    .stale {
      position: absolute;
      right: 72px;
      bottom: 22px;
      font-size: 22px;
      line-height: 1.4;
      color: #284441;
    }
    .stale:before {
      content: "";
      display: inline-block;
      width: 14px;
      height: 14px;
      margin: 0 10px 2px 0;
      vertical-align: middle;
      border-radius: 50%;
      background: #c98f7f;
    }

    /* Landscape 1920x1080: header row (logo | room · clock), then 50/50: hero + QR left half, timeline right half */
    .is-land #stage {
      width: 1920px;
      height: 1080px;
      margin: -540px 0 0 -960px;
    }
    .is-land .top {
      height: 150px;
    }
    .is-land .sheet-art { bottom: 0; } /* right column has no footer under it; sits at the stage's own corner */
    .is-land .logo { top: 33px; }
    .is-land .clock { top: 18px; }
    .is-land .room {
      position: absolute;
      left: 523px;
      right: 480px;
      top: 33px;
      margin-top: 0; /* undo the portrait seam-patch offset: this row is absolutely positioned, not stacked under .top */
      height: 84px;
      padding: 0 0 0 44px;
      border-left: 3px solid #88b89d;
      background: none; /* sits on .top's sage band */
      font-size: 60px;
      line-height: 84px;
    }
    .is-land .hero {
      position: absolute;
      z-index: 1; /* above the footer band, whose top tucks under the rounded corner */
      left: 0;
      top: 150px;
      width: 960px;
      height: 750px;
    }
    .is-land .panel {
      position: absolute;
      left: 1000px;
      right: 40px;
      top: 150px;
      bottom: 0;
      height: auto;
      margin: 0;
      padding: 44px 32px 36px;
    }
    .is-land .item-title { /* narrower column: allow two lines */
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      max-height: 96px;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .is-land .foot { /* left-half band; starts 200px up behind the hero so its rounded corner sits on the tint */
      position: absolute;
      left: 0;
      top: 700px;
      width: 960px;
      height: 380px;
      padding-top: 200px;
    }

    @-webkit-keyframes aurora {
      0%, 100% { -webkit-transform: translate3d(0, 0, 0); }
      33% { -webkit-transform: translate3d(-30%, -8%, 0); }
      66% { -webkit-transform: translate3d(-12%, -30%, 0); }
    }
    @keyframes aurora {
      0%, 100% { transform: translate3d(0, 0, 0); }
      33% { transform: translate3d(-30%, -8%, 0); }
      66% { transform: translate3d(-12%, -30%, 0); }
    }
    @-webkit-keyframes spin { from { -webkit-transform: rotate(0deg); } to { -webkit-transform: rotate(360deg); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @-webkit-keyframes ring {
      0% { opacity: .55; -webkit-transform: scale(1); }
      80%, 100% { opacity: 0; -webkit-transform: scale(2.4); }
    }
    @keyframes ring {
      0% { opacity: .55; transform: scale(1); }
      80%, 100% { opacity: 0; transform: scale(2.4); }
    }
    @-webkit-keyframes shimmer {
      0% { -webkit-transform: translate3d(-100%, 0, 0); }
      45%, 100% { -webkit-transform: translate3d(100%, 0, 0); }
    }
    @keyframes shimmer {
      0% { transform: translate3d(-100%, 0, 0); }
      45%, 100% { transform: translate3d(100%, 0, 0); }
    }
    @-webkit-keyframes blink {
      0%, 40%, 100% { opacity: 1; }
      50%, 90% { opacity: .25; }
    }
    @keyframes blink {
      0%, 40%, 100% { opacity: 1; }
      50%, 90% { opacity: .25; }
    }
    @-webkit-keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @-webkit-keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @-webkit-keyframes rise {
      from { opacity: 0; -webkit-transform: translate3d(0, 20px, 0); }
      to { opacity: 1; -webkit-transform: translate3d(0, 0, 0); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translate3d(0, 20px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    /* ?motion=0 / prefers-reduced-motion: everything static (aurora + pinwheel rest at their start pose) */
    .no-motion *, .no-motion *:before, .no-motion *:after {
      -webkit-animation: none !important;
      animation: none !important;
      -webkit-transition: none !important;
      transition: none !important;
      will-change: auto !important;
    }
    .no-motion .ring, .no-motion .dot:after, .no-motion .bar i:after { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="sheet-art"></div>
    <header class="top">
      <img class="logo" src="assets/ramasri-logo.png" alt="ศูนย์การแพทย์รามาธิบดีศรีอยุธยา" />
      <div class="clock">
        <div id="time" class="time"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span></div>
        <div id="date" class="date"></div>
      </div>
    </header>

    <h1 id="room" class="room"></h1>

    <section id="hero" class="hero is-idle">
      <div class="hero-aurora"></div>
      <div class="hero-art"></div>
      <div id="heroBody" class="hero-body"></div>
    </section>

    <section class="panel"><div id="agenda" class="agenda"></div></section>

    <footer class="foot">
      <div class="qr"><img src="qrcode.svg" alt="QR Code สำหรับจองห้องประชุม" /></div>
      <div class="foot-text">
        <div class="foot-cta">สแกนเพื่อจองห้องประชุม</div>
        <div class="foot-tag">สุขภาพที่ยืนยาว คือความสุขที่ยั่งยืน</div>
      </div>
      <div id="stale" class="stale is-hidden">อัปเดตไม่สำเร็จ</div>
    </footer>
  </div>

  <script>
    var ROOM_NAME = "ห้องประชุม 501";
    var API_URL = "https://default03c56608515c49f3b2e42aad4e09c8.ce.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c6a09f6c1d24428c8d89b922c072069a/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=KxTz_WCDQkhg9JBVXQb4yuKOXuq76lMEveJsUTyifOs&room=ห้องประชุม 501";
    var API_KEY = "kSbQY970ZbEUphoj3XJC8TO9bemtxH2O";

    var QUOTES = [
      "สุขภาพดีไม่มีขาย อยากได้ต้องสร้างเองทุกวัน",
      "ออกกำลังกายวันละนิด สุขภาพจิตก็ดีตาม",
      "พักผ่อนให้พอ แล้วพรุ่งนี้จะพร้อมสำหรับทุกสิ่ง",
      "กินอาหารเป็นยา ดีกว่ากินยาเป็นอาหาร",
      "ยิ้มบ่อย ๆ หัวใจก็แข็งแรงตาม",
      "น้ำเปล่าคือเพื่อนแท้ของร่างกาย",
      "การนอนคือการชาร์จพลังชีวิต",
      "เครียดน้อยลง หัวใจก็เต้นเป็นจังหวะที่สวยงามขึ้น",
      "กายแข็งแรง จิตใจเบิกบาน ชีวิตก็สดใส",
      "เดินช้าแต่สม่ำเสมอ ดีกว่าวิ่งแล้วล้ม",
      "สุขภาพใจ สำคัญไม่แพ้สุขภาพกาย",
      "อย่ารอให้ป่วยแล้วค่อยดูแลตัวเอง",
      "ชีวิตดีขึ้นทันที เมื่อเริ่มรักตัวเอง",
      "การดูแลสุขภาพไม่ใช่เทรนด์ แต่คือการลงทุนระยะยาว",
      "ออกกำลังกายไม่ได้ทำให้เหนื่อย แต่ทำให้แข็งแรง",
      "หายใจลึก ๆ แล้วใช้ชีวิตอย่างมีสติ",
      "สุขภาพคือของขวัญที่ให้ตัวเองได้ทุกวัน",
      "ความสุขเริ่มที่ใจดี และร่างกายที่พร้อม",
      "ใส่ใจอาหารทุกคำ คือความรักที่ให้ตัวเอง",
      "ความเจ็บป่วยบางอย่างป้องกันได้ ด้วยการเปลี่ยนนิสัยวันนี้",
      "ไม่ต้องดีที่สุด แค่ดูแลตัวเองให้ดีขึ้นทุกวันก็พอ",
      "หยุดพักไม่ได้แปลว่าแพ้ แต่แปลว่ากำลังชาร์จพลัง",
      "กินน้อยลง เคลื่อนไหวมากขึ้น แล้วร่างกายจะขอบคุณคุณ",
      "สุขภาพดี เริ่มที่ความตั้งใจจริง",
      "ใจที่สงบ เป็นยารักษาโรคชั้นดี",
      "อย่ารอให้สุขภาพเตือน ถึงเริ่มเปลี่ยนพฤติกรรม",
      "เสียงหัวเราะคือวิตามินของชีวิต",
      "การดูแลสุขภาพ คือการแสดงความเคารพต่อตัวเอง",
      "เริ่มต้นวันใหม่ด้วยน้ำหนึ่งแก้ว และความคิดดีหนึ่งอย่าง",
      "ไม่ต้องรีบ แต่ต้องเริ่ม",
      "เคลื่อนไหวร่างกายทุกวัน คือความกรุณาที่มีต่อตัวเอง",
      "นอนเร็ว ตื่นเช้า สุขภาพยืนยาว",
      "เลือกอาหารคือเลือกอนาคตของร่างกาย",
      "ร่างกายเราคือบ้านหลังแรก อย่าปล่อยให้ทรุดโทรม",
      "จงฟังเสียงของร่างกาย ก่อนที่มันจะตะโกน",
      "อากาศดี อาหารดี ความคิดดี ชีวิตก็ดีตาม",
      "การเดินเร็ววันละ 30 นาที ดีกว่านั่งทั้งวัน",
      "รักตัวเอง คือการดูแลสุขภาพด้วยความตั้งใจ",
      "ความเครียดไม่เคยช่วยให้สุขภาพดีขึ้น",
      "รอยยิ้มคือยาฟรี ที่ไม่มีผลข้างเคียง",
      "ใจดีต่อคนอื่น เริ่มจากใจดีต่อตัวเองก่อน",
      "ท่ามกลางความวุ่นวาย สุขภาพคือฐานมั่นคงที่สุด",
      "ดื่มน้ำเมื่อกระหาย พักผ่อนเมื่อเหนื่อย",
      "ลดหวาน ลดเค็ม เพิ่มชีวิต",
      "ร่างกายแข็งแรง คือทุนที่ไม่มีใครแย่งได้",
      "ตื่นเช้ารับแสงแดด ร่างกายได้วิตามิน ใจได้พลัง",
      "ความมั่งคั่งจริง ๆ คือการมีสุขภาพที่ดี",
      "สุขภาพที่ดี สร้างได้ด้วยการเลือกในแต่ละวัน",
      "ใช้ชีวิตให้สมดุล แล้วสุขภาพจะสมบูรณ์",
      "หายใจให้ลึก ยิ้มให้กว้าง แล้วเดินหน้าต่อไป"
    ];
    var FIXED_QUOTE = "Longer healthy life at your full potential.";

    var TH_DAYS = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
    var TH_DAYS_SHORT = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
    var TH_MONTHS = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
    var TH_MONTHS_SHORT = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

    // Motion off for ?motion=0, prefers-reduced-motion, or browsers without CSS animations (crossfades then swap instantly).
    var MOTION = !/[?&]motion=0(&|$)/.test(location.search) &&
      !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) &&
      ("animation" in document.documentElement.style || "webkitAnimation" in document.documentElement.style);

    var bookings = null;   // last good API payload
    var loadFailed = false;
    var inFlight = null;
    var inFlightAt = 0;
    var quote = "";
    var lastRandomQuote = null; // last non-fixed quote shown, so we never repeat back-to-back
    var lastMinute = "";
    // Hero view / quote / agenda are rebuilt only when their content changes, so running animations never restart.
    var heroKey = "", heroView = null, quoteEl = null, shownQuote = null, agendaSig = null;

    function $(id) { return document.getElementById(id); }
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
    function hm(min) { return pad(Math.floor(min / 60) % 24) + ":" + pad(min % 60); }
    function toMin(t) {
      var p = String(t).split(":");
      return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
    }
    function str(v) { return v == null ? "" : String(v).replace(/^\s+|\s+$/g, ""); }
    function esc(v) {
      return str(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function thaiDate(d) {
      return TH_DAYS[d.getDay()] + " " + d.getDate() + " " + TH_MONTHS[d.getMonth()] + " " + (d.getFullYear() + 543);
    }
    function dayLabel(date, now) {
      var tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      if (date === ymd(now)) return "วันนี้";
      if (date === ymd(tomorrow)) return "พรุ่งนี้";
      var p = date.split("-");
      var d = new Date(+p[0], +p[1] - 1, +p[2]);
      return TH_DAYS_SHORT[d.getDay()] + ". " + d.getDate() + " " + TH_MONTHS_SHORT[d.getMonth()];
    }
    function pickQuote(now) {
      var m = now.getMinutes();
      if (m % 15 === 0) { quote = FIXED_QUOTE; return; }
      var pick = QUOTES[Math.floor(Math.random() * QUOTES.length)];
      if (QUOTES.length > 1) { // re-roll so we never repeat the previous random quote
        while (pick === lastRandomQuote) pick = QUOTES[Math.floor(Math.random() * QUOTES.length)];
      }
      lastRandomQuote = pick;
      quote = pick;
    }

    // Not-yet-ended bookings, sorted; b.now = in progress.
    function upcoming(now) {
      var today = ymd(now);
      var nowMin = now.getHours() * 60 + now.getMinutes();
      var out = [];
      for (var i = 0; i < bookings.length; i++) {
        var b = bookings[i] || {};
        var date = str(b.date).slice(0, 10);
        var s = toMin(b.start), e = toMin(b.end);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(s) || isNaN(e)) continue;
        if (e <= s) e = 24 * 60; // e.g. "23:00"-"00:00"
        if (date < today || (date === today && e <= nowMin)) continue;
        out.push({ date: date, s: s, e: e, title: b.title, count: b.count, by: b.by,
                   now: date === today && s <= nowMin });
      }
      out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.s - b.s; });
      return out;
    }

    function titleHTML(b) { return esc(b.title) || "ไม่ระบุหัวข้อ"; }
    function metaHTML(b, cls) {
      var count = str(b.count), by = str(b.by), html = "";
      if (count) html += "<span>ผู้เข้าร่วม <b>" + esc(count) + (/^\d+$/.test(count) ? " คน" : "") + "</b></span>";
      if (by) html += "<span>ผู้จอง <b>" + esc(by) + "</b></span>";
      return html ? '<div class="' + cls + '">' + html + "</div>" : "";
    }

    function drop(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }
    // Insert el in front of old (so queries find the new one first), fade old out over it, then remove old.
    function crossfade(parent, el, old) {
      for (var i = parent.children.length - 1; i >= 0; i--) { // leftovers of an unfinished crossfade
        if (/\bis-out\b/.test(parent.children[i].className)) drop(parent.children[i]);
      }
      if (old && old.parentNode !== parent) old = null;
      parent.insertBefore(el, old);
      if (!old) return;
      if (!MOTION) return drop(old);
      old.className += " is-out";
      var done = function (e) { if (e.target === old) drop(old); };
      old.addEventListener("animationend", done, false);
      old.addEventListener("webkitAnimationEnd", done, false);
    }

    function showHero(cls, html) { // true when the view was rebuilt
      if (cls + html === heroKey) return false;
      heroKey = cls + html;
      $("hero").className = "hero " + cls;
      var v = document.createElement("div");
      v.className = "hero-view is-in";
      v.innerHTML = html;
      crossfade($("heroBody"), v, heroView);
      heroView = v;
      quoteEl = shownQuote = null;
      return true;
    }

    function renderFree(next) {
      var card = next
        ? '<div class="next-until">ว่างถึง ' + hm(next.s) + "</div>" +
          '<div class="next-row"><div class="next-when"><div class="next-label">ถัดไป</div>' +
          '<div class="next-time">' + hm(next.s) + " – " + hm(next.e) + "</div></div>" +
          '<div class="next-title">' + titleHTML(next) + "</div></div>"
        : '<div class="next-until">ว่างทั้งวัน</div><div class="next-sub">ไม่มีการจองต่อจากนี้ในวันนี้</div>';
      showHero("is-free", '<div class="free-word">ว่าง</div><div class="next">' + card + "</div>");
      if (quote === shownQuote) return;
      shownQuote = quote;
      var p = document.createElement("p");
      p.className = quoteEl ? "quote is-in" : "quote"; // a fresh view already fades in as a whole
      p.innerHTML = "“" + esc(quote) + "”";
      crossfade(heroView, p, quoteEl);
      quoteEl = p;
    }

    function renderBusy(b, now, force) {
      var nowMin = now.getHours() * 60 + now.getMinutes();
      var pct = Math.max(0, Math.min(100, (nowMin - b.s) / Math.max(1, b.e - b.s) * 100));
      if (showHero("is-busy",
          '<div class="busy-label"><i class="dot"></i>กำลังประชุม</div>' +
          '<h2 class="busy-title">' + titleHTML(b) + "</h2>" +
          '<div class="busy-foot">' +
            '<div class="busy-when">' + hm(b.s) + " – " + hm(b.e) + "</div>" +
            '<div class="bar"><i></i></div>' +
            metaHTML(b, "busy-meta") +
          "</div>") || force) fitTitle();
      heroView.querySelector(".bar i").style.width = pct.toFixed(1) + "%"; // in place: shimmer keeps running
    }

    // Shrink long titles until they clear the footer block; clip whole lines as a last resort.
    function fitTitle() {
      var t = heroView.querySelector(".busy-title");
      var limit = heroView.querySelector(".busy-foot").offsetTop - 32, size = 68;
      t.style.maxHeight = "";
      t.style.fontSize = size + "px";
      while (size > 40 && t.offsetTop + t.offsetHeight > limit) {
        size -= 4;
        t.style.fontSize = size + "px";
      }
      if (t.offsetTop + t.offsetHeight > limit) {
        var line = size * 1.3;
        t.style.maxHeight = Math.floor((limit - t.offsetTop) / line) * line + "px";
      }
    }

    function renderIdle() {
      showHero("is-idle", loadFailed
        ? '<div class="idle"><div class="idle-title">โหลดตารางจองไม่สำเร็จ</div>' +
          '<div class="idle-sub">ระบบจะลองใหม่อัตโนมัติทุก 1 นาที<br />ระหว่างนี้สแกน QR ด้านล่างเพื่อดูและจองห้อง</div></div>'
        : '<div class="idle"><div class="idle-title">กำลังโหลดตารางจอง…</div></div>');
    }

    function agendaHTML(items, n, now) {
      var html = "", day = null, k = 0;
      function rise() { // closes the class attribute: fade-up, staggered 80ms per line
        var s = (k++ * 0.08).toFixed(2) + "s";
        return ' rise" style="-webkit-animation-delay:' + s + ";animation-delay:" + s + '"';
      }
      for (var i = 0; i < n; i++) {
        var b = items[i];
        if (b.date !== day) {
          html += (day === null ? "" : "</div>") + '<div class="group"><div class="group-head' + rise() + ">" + dayLabel(b.date, now) + "</div>";
          day = b.date;
        }
        html += '<div class="item' + (b.now ? " is-now" : "") + rise() + ">" +
          '<div class="item-time">' + hm(b.s) + "<small>" + hm(b.e) + "</small></div>" +
          '<div class="item-rail">' + (b.now ? '<i class="ring"></i>' : "") + "</div>" +
          '<div class="item-body"><div class="item-title">' + (b.now ? '<span class="tag">กำลังประชุม</span>' : "") +
          titleHTML(b) + "</div>" + metaHTML(b, "item-meta") + "</div></div>";
      }
      html += "</div>";
      if (n < items.length) html += '<div class="more' + rise() + ">+ อีก " + (items.length - n) + " รายการ</div>";
      return html;
    }

    function renderAgenda(items, now, force) {
      var el = $("agenda"), sig = agendaHTML(items, items.length, now);
      // Same data: keep the rows (no per-minute flicker); a forced re-fit only rebuilds if the fit may have changed.
      if (sig === agendaSig && !(force && (el.scrollHeight > el.clientHeight || el.querySelector(".more")))) return;
      agendaSig = sig;
      if (!items.length) {
        el.innerHTML = '<div class="empty rise">ไม่มีการจองถัดไป</div>';
        return;
      }
      // ponytail: re-lays out once per dropped item; fine for a room's handful of bookings.
      for (var n = items.length; n > 0; n--) {
        el.innerHTML = agendaHTML(items, n, now);
        if (el.scrollHeight <= el.clientHeight) return;
      }
    }

    function render(force) { // force: re-fit after font/orientation changes
      var now = new Date();
      $("stale").className = bookings && loadFailed ? "stale" : "stale is-hidden";
      if (!bookings) {
        renderIdle();
        $("agenda").innerHTML = "";
        agendaSig = null;
        return;
      }
      var items = upcoming(now), current = null, next = null, rest = [], i;
      for (i = 0; i < items.length; i++) {
        if (items[i].now && (!current || items[i].e < current.e)) current = items[i];
      }
      for (i = 0; i < items.length; i++) {
        if (items[i] === current) continue;
        if (!next && items[i].date === ymd(now)) next = items[i];
        rest.push(items[i]);
      }
      if (current) renderBusy(current, now, force);
      else renderFree(next);
      renderAgenda(rest, now, force);
    }

    function load() {
      if (inFlight) return;
      var xhr = new XMLHttpRequest();
      inFlight = xhr;
      inFlightAt = new Date().getTime();
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4 || inFlight !== xhr) return;
        inFlight = null;
        var data = null;
        if (xhr.status === 200) {
          try { data = JSON.parse(xhr.responseText); } catch (e) { data = null; }
        }
        if (Object.prototype.toString.call(data) === "[object Array]") {
          bookings = data;
          loadFailed = false;
        } else {
          loadFailed = true;
        }
        render();
      };
      try {
        xhr.open("POST", API_URL, true);
        xhr.setRequestHeader("x-api-key", API_KEY);
        xhr.send(null);
      } catch (err) {
        inFlight = null;
        loadFailed = true;
        render();
      }
    }

    function tick() {
      var now = new Date();
      var t = pad(now.getHours()) + ":" + pad(now.getMinutes());
      if (ymd(now) + t === lastMinute) return;
      var first = lastMinute === "";
      lastMinute = ymd(now) + t;
      $("hh").innerHTML = pad(now.getHours()); // digits only: the blinking colon is never re-created
      $("mm").innerHTML = pad(now.getMinutes());
      $("date").innerHTML = thaiDate(now);
      if (first || now.getMinutes() % 5 === 0) pickQuote(now);
      if (inFlight && now.getTime() - inFlightAt > 50000) { // hung request: drop it and retry
        var stuck = inFlight;
        inFlight = null;
        try { stuck.abort(); } catch (e) {}
        loadFailed = true;
      }
      if (first || now.getMinutes() % 15 === 0 || loadFailed) load();
      render();
    }

    // Fit the stage to the screen: 1080x1920 portrait or 1920x1080 landscape, picked by the panel's
    // aspect as the viewer sees it. ?rotate=90|270 when the panel is mounted turned against the video output.
    var ROTATE = (function () {
      var m = /[?&]rotate=(90|270)(&|$)/.exec(location.search);
      return m ? parseInt(m[1], 10) : 0;
    })();
    var land = null;
    function fitStage() { // returns true when the orientation changed
      var w = window.innerWidth || document.documentElement.clientWidth;
      var h = window.innerHeight || document.documentElement.clientHeight;
      if (ROTATE) { var t = w; w = h; h = t; }
      var isLand = w > h;
      var s = isLand ? Math.min(w / 1920, h / 1080) : Math.min(w / 1080, h / 1920);
      var tf = (ROTATE ? "rotate(" + ROTATE + "deg) " : "") + "scale(" + s + ")";
      var st = $("stage").style;
      st.webkitTransform = tf;
      st.msTransform = tf;
      st.transform = tf;
      if (isLand === land) return false;
      land = isLand;
      document.body.className = (isLand ? "is-land" : "") + (MOTION ? "" : " no-motion");
      return true;
    }

    document.title = ROOM_NAME + " · ตารางจองห้องประชุม";
    $("room").innerHTML = esc(ROOM_NAME);
    fitStage();
    window.onresize = function () { if (fitStage()) render(true); };
    tick();
    setInterval(tick, 1000);
    // Re-fit title/list once web fonts arrive (metrics change).
    if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", function () { render(true); });
    window.onload = function () { render(true); };
  </script>
